server:
  port: 8087

spring:
  application:
    name: fpx-imps-application
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    queue: my-queue
    exchange: my-exchange
    routingKey: my-routing-key
  main:
    allow-bean-definition-overriding: true

logging:
  level:
    org:
      apache:
        kafka: DEBUG
      springframework:
        amqp: DEBUG
        rabbit: DEBUG
